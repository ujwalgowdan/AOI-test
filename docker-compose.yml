# Local dev stack: Postgres + FastAPI backend + Vite frontend.
#
# Usage:
#   docker compose up --build           # boot everything
#   docker compose down                 # stop (volumes preserved)
#   docker compose down -v              # stop + drop the DB volume
#
# Notes:
# - The frontend dev server runs in plain HTTP so localhost camera access
#   works without a self-signed cert. Set VITE_DEV_HTTPS=1 to flip it.
# - AOI_DATA_DIR is mounted as a named volume so captured JPEGs survive
#   container rebuilds, but they're NOT in the DB — image bytes stay on
#   disk and the DB stores the filename + metadata only.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aoi
      POSTGRES_PASSWORD: aoi
      POSTGRES_DB: aoi
    ports:
      - "5433:5432"   # host 5433 matches .env; 5432 is often taken by other local Postgres
    volumes:
      - aoi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aoi -d aoi"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      target: dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://aoi:aoi@db:5432/aoi
      AOI_DATA_DIR: /data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}  # required; missing/weak -> admin routes return 503
      SENDER_EMAIL: ${SENDER_EMAIL:-}
      SENDER_PASSWORD: ${SENDER_PASSWORD:-}
      RECIPIENT_EMAILS: ${RECIPIENT_EMAILS:-}
      COMPANY_NAME: ${COMPANY_NAME:-Innotech Integration}
      MACHINE_NAME: ${MACHINE_NAME:-AOI Tester - M03}
      # F-05 station token (see .env.example). Off by default = today's behaviour.
      AOI_REQUIRE_STATION_TOKEN: ${AOI_REQUIRE_STATION_TOKEN:-0}
      AOI_STATION_TOKEN: ${AOI_STATION_TOKEN:-}
      # Force watchfiles (used by uvicorn --reload) to poll. Native
      # filesystem events don't propagate from a Windows host through
      # the WSL2 bind mount, so without this uvicorn never reloads on
      # source edits and stale code sticks around until the container
      # is restarted by hand.
      WATCHFILES_FORCE_POLLING: "true"
    # Host port 8001 to avoid conflicting with whatever else may already
    # have bound 8000 on this machine. The frontend container talks to
    # the backend by container DNS name (`backend:8000`) over the
    # compose network, so this only affects host-side access (curl,
    # browser /docs, etc.).
    ports:
      - "${BACKEND_HOST_PORT:-8001}:8000"
    volumes:
      - ./backend:/app          # live-reload on host edits
      - aoi_data:/data          # captured JPEGs survive rebuilds

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_DEV_HTTPS: "0"
      VITE_BACKEND_URL: http://backend:8000
      VITE_STATION_TOKEN: ${AOI_STATION_TOKEN:-}  # must match the backend's token
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  aoi_pgdata:
  aoi_data:
  frontend_node_modules:
